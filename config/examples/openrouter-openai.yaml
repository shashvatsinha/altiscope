# OpenRouter using an OpenAI model. Requires OPENROUTER_API_KEY in .env.
providers:
  openrouter:
    kind: openai_compatible
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    timeout_seconds: 120
models:
  openrouter-openai:
    provider: openrouter
    model_name: openai/gpt-5.5
    display_name: GPT-5.5 via OpenRouter
    context_window: 1050000
    max_output_tokens: 128000
    input_usd_per_mtok: 5
    output_usd_per_mtok: 30
    capabilities: [json_schema]
input_budget_fraction: 0.75
stages:
  pr_summary:
    candidates: [openrouter-openai]
    effort: low
    reserved_output_tokens: 4096
  aggregate:
    candidates: [openrouter-openai]
    reserved_output_tokens: 4096
  verify:
    candidates: [openrouter-openai]
    reserved_output_tokens: 4096
