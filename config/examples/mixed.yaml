# Mixed vendors: Claude reads diffs and synthesizes; a self-hosted vLLM model verifies.
# Provider exclusion selects a different configured provider; models may still share errors.
providers:
  anthropic:
    kind: anthropic
    api_key_env: ANTHROPIC_API_KEY
  vllm:
    kind: openai_compatible
    base_url: http://vllm.internal:8000/v1
    api_key_env: VLLM_API_KEY

models:
  claude-opus-5:
    provider: anthropic
    display_name: Claude Opus 5
    context_window: 1000000
    max_output_tokens: 128000
    input_usd_per_mtok: 5.00
    output_usd_per_mtok: 25.00
    capabilities: [json_schema, reasoning_effort, token_counting]
  qwen3-235b:
    provider: vllm
    model_name: Qwen/Qwen3-235B-A22B
    display_name: Qwen3 235B (vLLM)
    context_window: 131072
    max_output_tokens: 32768
    capabilities: [json_schema]

input_budget_fraction: 0.75

stages:
  pr_summary:
    candidates: [claude-opus-5]
    effort: high
    reserved_output_tokens: 16000
  aggregate:
    candidates: [claude-opus-5]
    effort: high
    reserved_output_tokens: 16000
  verify:
    candidates: [qwen3-235b, claude-opus-5]
    effort: high
    reserved_output_tokens: 4000
    producer_independence: provider
