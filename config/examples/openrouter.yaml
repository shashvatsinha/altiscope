# OpenRouter-only registry. Requires OPENROUTER_API_KEY in .env.
# Select the model family by changing the pr_summary candidate (or use one of the
# narrower openrouter-anthropic.yaml/openrouter-openai.yaml examples).
providers:
  openrouter:
    kind: openai_compatible
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    timeout_seconds: 120
models:
  openrouter-anthropic:
    provider: openrouter
    model_name: anthropic/claude-sonnet-5
    display_name: Claude Sonnet 5 via OpenRouter
    context_window: 1000000
    max_output_tokens: 128000
    input_usd_per_mtok: 2
    output_usd_per_mtok: 10
    capabilities: [json_schema]
  openrouter-openai:
    provider: openrouter
    model_name: openai/gpt-5.5
    display_name: GPT-5.5 via OpenRouter
    context_window: 1050000
    max_output_tokens: 128000
    input_usd_per_mtok: 5
    output_usd_per_mtok: 30
    capabilities: [json_schema]
  openrouter-google:
    provider: openrouter
    model_name: google/gemini-2.5-flash
    display_name: Gemini 2.5 Flash via OpenRouter
    context_window: 1000000
    max_output_tokens: 65536
    input_usd_per_mtok: 0.3
    output_usd_per_mtok: 2.5
    capabilities: [json_schema]
input_budget_fraction: 0.75
stages:
  pr_summary:
    candidates: [openrouter-anthropic]
    effort: low
    reserved_output_tokens: 4096
  aggregate:
    candidates: [openrouter-anthropic]
    reserved_output_tokens: 4096
  verify:
    candidates: [openrouter-anthropic]
    reserved_output_tokens: 4096
