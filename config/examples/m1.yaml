# M1 opt-in live smoke configuration; checked against provider docs 2026-09-07.
# https://platform.claude.com/docs/en/models/sonnet-4-6/overview
providers:
  anthropic:
    kind: anthropic
    api_key_env: ANTHROPIC_API_KEY
    timeout_seconds: 120
models:
  claude-sonnet-4-6:
    provider: anthropic
    display_name: Claude Sonnet 4.6
    context_window: 1000000
    max_output_tokens: 128000
    input_usd_per_mtok: 3
    output_usd_per_mtok: 15
    capabilities: [json_schema, reasoning_effort, token_counting]
input_budget_fraction: 0.75
stages:
  pr_summary:
    candidates: [claude-sonnet-4-6]
    effort: low
    reserved_output_tokens: 4096
  aggregate:
    candidates: [claude-sonnet-4-6]
    reserved_output_tokens: 4096
  verify:
    candidates: [claude-sonnet-4-6]
    reserved_output_tokens: 4096
