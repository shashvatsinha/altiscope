# Providers, models, and stage preferences. See docs/adr/0005-model-registry-routing.md.
# Endpoint compatibility and output quality need testing before choosing defaults.
# Example configurations are in config/examples/.
#
# Confirm context limits and prices before use. Prices are USD per million tokens,
# intended for reporting; routing uses capacity and configured preference.

providers:
  # Declare separate providers to use the same adapter with different endpoints.
  anthropic:
    kind: anthropic
    api_key_env: ANTHROPIC_API_KEY
  ollama:
    kind: openai_compatible
    base_url: http://localhost:11434/v1
    api_key_env: null          # local, unauthenticated

models:
  claude-opus-5:
    provider: anthropic
    display_name: Claude Opus 5
    context_window: 1000000
    max_output_tokens: 128000
    input_usd_per_mtok: 5.00
    output_usd_per_mtok: 25.00
    capabilities: [json_schema, reasoning_effort, token_counting]
  claude-sonnet-5:
    provider: anthropic
    display_name: Claude Sonnet 5
    context_window: 1000000
    max_output_tokens: 128000
    input_usd_per_mtok: 2.00
    output_usd_per_mtok: 10.00
    capabilities: [json_schema, reasoning_effort, token_counting]
  claude-haiku-4-5:
    provider: anthropic
    display_name: Claude Haiku 4.5
    context_window: 200000
    max_output_tokens: 64000
    input_usd_per_mtok: 1.00
    output_usd_per_mtok: 5.00
    capabilities: [json_schema, token_counting]
  # An open-source model served locally. Not a default candidate; available to route to.
  # Verify the model name and context length against your Ollama install.
  llama-3.3-70b:
    provider: ollama
    model_name: llama3.3:70b
    display_name: Llama 3.3 70B (Ollama)
    context_window: 131072
    max_output_tokens: 16384
    capabilities: [json_schema]

# Scale the context window by this fraction, then subtract the stage's reserved
# output tokens to get the input budget. Request-size estimates need to include overhead.
input_budget_fraction: 0.75

stages:
  # Describe the selected material from one PR as claims with evidence.
  pr_summary:
    candidates: [claude-opus-5]
    effort: high
    reserved_output_tokens: 16000
  # Combine PR summaries or child aggregates into one account.
  aggregate:
    candidates: [claude-opus-5]
    effort: high
    reserved_output_tokens: 16000
  # Review one claim against its evidence. "model" skips the producing model;
  # "provider" skips every model on its configured provider.
  verify:
    candidates: [claude-sonnet-5, claude-opus-5]
    effort: high
    reserved_output_tokens: 4000
    producer_independence: model
