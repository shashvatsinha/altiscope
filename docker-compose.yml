services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: altiscope
      POSTGRES_PASSWORD: altiscope
      POSTGRES_DB: altiscope
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U altiscope"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
